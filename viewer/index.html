<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan Viewer</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "three": "/viewer/vendor/three.module.js",
        "three/addons/": "/viewer/vendor/addons/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1c2027; --muted: #5f6877; --line: #dde1e7;
      --accent: #2f6fed; --accent-text: #ffffff; --danger: #c2362b;
      --queued: #8a6d00; --queued-bg: #fff4cc;
      --working: #1d5fb8; --working-bg: #dfeaff;
      --ready: #1b7a43; --ready-bg: #dcf5e5;
      --failed: #b3261e; --failed-bg: #fde3e1;
      --stage: #1b1d22;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --panel: #1d2026; --text: #e8eaee; --muted: #9aa3b2; --line: #2c313a;
        --accent: #6c9bff; --accent-text: #0e1116; --danger: #ff8077;
        --queued: #f2d36b; --queued-bg: #3a3112;
        --working: #8db4ff; --working-bg: #192a4a;
        --ready: #77d79b; --ready-bg: #143323;
        --failed: #ff9a93; --failed-bg: #4a1a17;
        --stage: #0d0e11;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    h1 { font-size: 17px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
    main { padding: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .hidden { display: none !important; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input[type=text], input[type=email], input[type=password], select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
      background: var(--bg); color: var(--text); font: inherit; }
    input[type=file] { width: 100%; font: inherit; color: var(--muted); }
    button { font: inherit; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--panel); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .55; cursor: default; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 0 0 auto; }
    .row > .grow { flex: 1 1 160px; }
    .error { color: var(--danger); font-size: 13px; margin: 8px 0 0; min-height: 1em; }
    #auth-card { max-width: 380px; margin: 48px auto; }
    #layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 800px) { #layout { grid-template-columns: 1fr; } }
    #scan-list { list-style: none; margin: 8px 0 0; padding: 0; }
    #scan-list li { margin: 0 0 6px; }
    #scan-list button { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; }
    #scan-list button[aria-current=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .scan-name { font-weight: 600; overflow-wrap: anywhere; }
    .scan-meta { font-size: 12px; color: var(--muted); }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.uploaded { color: var(--queued); background: var(--queued-bg); }
    .badge.validating, .badge.processing { color: var(--working); background: var(--working-bg); }
    .badge.ready { color: var(--ready); background: var(--ready-bg); }
    .badge.failed { color: var(--failed); background: var(--failed-bg); }
    #stage { position: relative; height: 56vh; min-height: 320px; background: var(--stage);
      border-radius: 8px; overflow: hidden; margin-top: 12px; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #stage-message { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
      text-align: center; color: #c5ccd8; }
    .details { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    #detail-title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #detail-title strong { font-size: 17px; overflow-wrap: anywhere; }
    .stack > * + * { margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Scan Viewer</h1>
    <div class="row">
      <span id="whoami" class="details hidden"></span>
      <button id="sign-out" class="hidden">Sign out</button>
    </div>
  </header>

  <main>
    <section id="auth-card" class="card">
      <h2>Sign in</h2>
      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password (8 characters or more)</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="8">
        <div class="row" style="margin-top:14px">
          <button class="primary" type="submit" data-kind="login">Sign in</button>
          <button type="submit" data-kind="register">Create account</button>
        </div>
        <p id="auth-error" class="error" role="alert"></p>
      </form>
    </section>

    <div id="app" class="stack hidden">
      <section class="card">
        <p id="demo-note" class="details hidden" style="margin:0 0 10px">
          Demo mode: there is no sign-in, and everyone who opens this page shares one workspace.
          Please do not upload anything private.
        </p>
        <div class="row">
          <div class="grow">
            <label for="org-select" style="margin-top:0">Organization</label>
            <select id="org-select"></select>
          </div>
          <form id="org-form" class="row grow" style="align-self:flex-end">
            <input id="org-name" class="grow" type="text" placeholder="New organization name" maxlength="200" aria-label="New organization name">
            <button type="submit">Create</button>
          </form>
        </div>
        <p id="org-error" class="error" role="alert"></p>
      </section>

      <div id="layout">
        <aside class="stack">
          <section id="upload-card" class="card">
            <h2>Upload a scan</h2>
            <form id="upload-form">
              <label for="file">PLY file</label>
              <input id="file" type="file" accept=".ply" required>
              <p id="upload-hint" class="details" style="margin:4px 0 0"></p>
              <label for="scan-name">Name (optional)</label>
              <input id="scan-name" type="text" maxlength="200">
              <div class="row" style="margin-top:12px">
                <button id="upload-button" class="primary" type="submit">Upload</button>
              </div>
              <p id="upload-error" class="error" role="alert"></p>
            </form>
          </section>
          <section class="card">
            <h2>Scans</h2>
            <p id="list-empty" class="details hidden">No scans yet.</p>
            <ul id="scan-list"></ul>
            <p id="list-error" class="error" role="alert"></p>
          </section>
        </aside>

        <section class="card" id="detail">
          <div id="detail-empty" class="details">Pick a scan to see it here.</div>
          <div id="detail-body" class="hidden">
            <div id="detail-title">
              <strong id="detail-name"></strong>
              <span id="detail-badge" class="badge"></span>
              <button id="delete-button" class="danger hidden">Delete</button>
            </div>
            <p id="detail-info" class="details"></p>
            <div id="stage"><div id="stage-message"></div></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="/viewer/app.js"></script>
</body>
</html>
