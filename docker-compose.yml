services:
  api:
    build: .
    ports: ["${API_PORT:-8000}:8000"]
    env_file: .env.example
    volumes: ["storage:/data/storage"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 20
  worker:
    build: .
    command: rq worker scans --url redis://redis:6379/0
    env_file: .env.example
    volumes: ["storage:/data/storage"]
    depends_on:
      api: {condition: service_healthy}
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: scans
      POSTGRES_PASSWORD: scans
      POSTGRES_DB: scans
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scans"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
volumes:
  pgdata:
  storage:
